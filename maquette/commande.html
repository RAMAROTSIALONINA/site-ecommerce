<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Commande — Site E_commerce</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0F766E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=5">
</head>
<body data-page="commande">
  <div id="app-header"></div>

  <main class="container" style="max-width:1180px">
    <h1 class="sr-only">Passer commande</h1>
    <nav class="breadcrumb" aria-label="Fil d’Ariane"><a href="panier.html">Panier</a><svg class="ico" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg><span>Commande sécurisée</span></nav>
    <div class="steps" id="steps"><div class="st">1. Adresse</div><div class="st">2. Livraison</div><div class="st">3. Paiement</div><div class="st">4. Confirmation</div></div>
    <div id="view"></div>
  </main>

  <div id="app-footer"></div>

  <script src="assets/js/data.js?v=5"></script>
  <script src="assets/js/core.js?v=5"></script>
  <script src="assets/js/shop.js?v=5"></script>
  <script>
    const { icon, fmt, esc, pv, Cart, dispo, store, applyPromo, toast, modal, validate, RX, Z, PAY, Orders } = App;
    const user = App.User.get();
    const S = { step: 1, adresse: 'a1', nouvelle: null, zone: null, creneau: 'Matin (8 h – 12 h)', paiement: null, mmTel: '', cgv: false, note: '' };

    const lines = () => Cart.detail();
    function totals() {
      const ls = lines(); const sousTotal = ls.reduce((s, l) => s + l.total, 0);
      let remise = 0, promo = null; const code = store.get('promo', null);
      if (code) { const r = applyPromo(code, ls); if (r.ok) { remise = r.remise; promo = r.promo; } }
      const zone = Z(S.zone || store.get('zone', 'tana-centre'));
      return { ls, sousTotal, remise, promo, zone, frais: zone.frais, total: sousTotal - remise + zone.frais };
    }
    const addr = () => S.adresse === 'new' ? S.nouvelle : DB.adresses.find(a => a.id === S.adresse);
    // Zones autorisées selon la ville : bloque les incohérences qui fausseraient les frais
    function zonesPour(a) {
      if (!a) return DB.zones;
      const ville = (a.ville || '').toLowerCase();
      const grandes = ['toamasina', 'antsirabe', 'mahajanga', 'fianarantsoa', 'toliara', 'antsiranana'];
      return DB.zones.filter(z => {
        if (z.id === 'retrait') return true;
        if (z.id === 'tana-centre') return ville === 'antananarivo' && /renivohitra/i.test(a.commune || '');
        if (z.id === 'tana-peri') return a.region === 'Analamanga' && !(ville === 'antananarivo' && /renivohitra/i.test(a.commune || ''));
        if (z.id === 'grandes-villes') return grandes.includes(ville);
        return a.region !== 'Analamanga' && !grandes.includes(ville);
      });
    }

    function summary(t) {
      return `<aside class="card card-pad summary">
        <h3>Votre commande</h3>
        ${t.ls.map(l => `<div class="mini-line">${pv(l.p, 'sm')}<div class="grow"><div class="small bold" style="line-height:1.3">${esc(l.p.nom)}</div><div class="xs muted">${l.variante ? esc(l.variante) + ' · ' : ''}Qté ${l.qte} · ${esc(l.v.nom)}</div></div><b class="small nowrap">${fmt(l.total)}</b></div>`).join('')}
        <div style="border-top:1px solid var(--line);margin-top:8px;padding-top:8px">
          <div class="sum-row"><span>Sous-total</span><b>${fmt(t.sousTotal)}</b></div>
          ${t.remise ? `<div class="sum-row"><span>Remise ${t.promo.code}</span><span class="discount">− ${fmt(t.remise)}</span></div>` : ''}
          <div class="sum-row"><span>Livraison · ${S.zone ? t.zone.nom : 'à choisir'}</span><b>${S.zone ? (t.frais ? fmt(t.frais) : 'Gratuit') : '—'}</b></div>
          <div class="sum-row total"><span>Total à payer</span><span>${fmt(S.zone ? t.total : t.total - t.frais)}</span></div>
        </div>
        <p class="xs muted" style="margin:10px 0 0">${icon('lock', 'sm')} Connexion chiffrée (HTTPS). Vos données ne sont jamais partagées avec les vendeurs au-delà de la livraison.</p>
      </aside>`;
    }

    function stepAdresse() {
      const saved = DB.adresses.filter(a => a.client === 'c1');
      const n = S.nouvelle || { nom: user.prenom + ' ' + user.nom, tel: user.tel, region: '', ville: '', commune: '', fokontany: '', adresse: '', repere: '' };
      return `<div class="card card-pad co-section">
        <h3><span class="num">1</span> Adresse de livraison</h3>
        <div class="options-grid two">${saved.map(a => `<label class="option-card ${S.adresse === a.id ? 'selected' : ''}"><input type="radio" name="adr" value="${a.id}" ${S.adresse === a.id ? 'checked' : ''}>
          <div><b>${a.libelle}</b>${a.defaut ? ' <span class="badge badge-primary">Par défaut</span>' : ''}<div class="small text-2">${esc(a.nom)} · ${a.tel}</div><div class="small text-2">${esc(a.adresse)}, ${a.fokontany}, ${a.ville}</div><div class="xs muted">Repère : ${esc(a.repere)}</div></div></label>`).join('')}
          <label class="option-card ${S.adresse === 'new' ? 'selected' : ''}"><input type="radio" name="adr" value="new" ${S.adresse === 'new' ? 'checked' : ''}><div><b>${icon('plus', 'sm')} Nouvelle adresse</b><div class="small muted">Livrer ailleurs</div></div></label>
        </div>
        <form id="f-adr" class="form-grid two ${S.adresse === 'new' ? '' : 'hidden'}" style="margin-top:16px" novalidate>
          <div class="field"><label>Nom complet <span class="req">*</span></label><input class="input" name="nom" data-rule="req" value="${esc(n.nom)}" autocomplete="name"><span class="err"></span></div>
          <div class="field"><label>Téléphone <span class="req">*</span></label><input class="input" name="tel" type="tel" inputmode="tel" data-rule="req tel" value="${esc(n.tel)}" autocomplete="tel" placeholder="034 12 345 67"><span class="err"></span><span class="hint">Le livreur vous appellera sur ce numéro</span></div>
          <div class="field"><label>Région <span class="req">*</span></label><select class="select" name="region" data-rule="req"><option value="">Choisir…</option>${DB.regions.map(r => `<option ${n.region === r ? 'selected' : ''}>${r}</option>`).join('')}</select><span class="err"></span></div>
          <div class="field"><label>Ville <span class="req">*</span></label><input class="input" name="ville" data-rule="req" value="${esc(n.ville)}" list="villes" placeholder="Ex. Antananarivo"><datalist id="villes"><option>Antananarivo</option><option>Toamasina</option><option>Antsirabe</option><option>Mahajanga</option><option>Fianarantsoa</option><option>Toliara</option><option>Antsiranana</option><option>Ambatondrazaka</option><option>Morondava</option></datalist><span class="err"></span></div>
          <div class="field"><label>Commune <span class="req">*</span></label><input class="input" name="commune" data-rule="req" value="${esc(n.commune)}" placeholder="Ex. Antananarivo Renivohitra"><span class="err"></span></div>
          <div class="field"><label>Fokontany <span class="req">*</span></label><input class="input" name="fokontany" data-rule="req" value="${esc(n.fokontany)}" placeholder="Ex. Ankadifotsy"><span class="err"></span></div>
          <div class="field span-2"><label>Adresse (lot, rue, immeuble) <span class="req">*</span></label><input class="input" name="adresse" data-rule="req" value="${esc(n.adresse)}" placeholder="Ex. Lot IVG 45 bis"><span class="err"></span></div>
          <div class="field span-2"><label>Point de repère</label><input class="input" name="repere" value="${esc(n.repere)}" placeholder="Ex. portail vert en face de l’épicerie"><span class="hint">Recommandé : aide le livreur à vous trouver rapidement</span></div>
          <label class="check span-2"><input type="checkbox" name="save" checked> Enregistrer cette adresse dans mon compte</label>
        </form>
        <div class="row between" style="margin-top:18px"><a class="btn btn-ghost" href="panier.html">${icon('chevron-left', 'sm')} Panier</a><button class="btn btn-primary btn-lg" data-next="2">Continuer</button></div>
      </div>`;
    }

    function stepLivraison() {
      const a = addr(); const ok = zonesPour(a);
      if (S.zone && !ok.find(z => z.id === S.zone)) S.zone = null;
      if (!S.zone && ok.length) S.zone = ok[0].id;
      return `<div class="card card-pad co-section">
        <h3><span class="num">2</span> Mode de livraison</h3>
        <div class="alert alert-info" style="margin-bottom:14px">${icon('pin')}<span>Livraison à : <b>${esc(a.adresse)}, ${esc(a.fokontany)}, ${esc(a.commune)} — ${esc(a.ville)} (${esc(a.region)})</b> · <a href="#" data-goto="1" style="font-weight:600">Modifier</a></span></div>
        <div class="options-grid">${DB.zones.filter(z => z.actif).map(z => { const allowed = ok.find(x => x.id === z.id); return `
          <label class="option-card ${S.zone === z.id ? 'selected' : ''}" style="${allowed ? '' : 'opacity:.5;cursor:not-allowed'}">
            <input type="radio" name="zone" value="${z.id}" ${S.zone === z.id ? 'checked' : ''} ${allowed ? '' : 'disabled'}>
            <div class="grow"><b>${z.nom}</b><div class="small muted">${z.detail}</div>${allowed ? '' : '<div class="xs" style="color:var(--danger)">Non disponible pour cette adresse</div>'}</div>
            <div class="right"><b>${z.frais ? fmt(z.frais) : 'Gratuit'}</b><div class="xs muted">${z.delai}</div></div></label>`; }).join('')}</div>
        ${['tana-centre', 'tana-peri'].includes(S.zone) ? `<div class="field" style="margin-top:14px"><label>Créneau de livraison souhaité</label><select class="select" id="creneau">${['Matin (8 h – 12 h)', 'Après-midi (13 h – 17 h)', 'Samedi matin'].map(c => `<option ${S.creneau === c ? 'selected' : ''}>${c}</option>`).join('')}</select></div>` : ''}
        <div class="field" style="margin-top:14px"><label>Instructions pour le livreur (facultatif)</label><textarea class="textarea" id="note" style="min-height:70px" placeholder="Ex. appeler 10 minutes avant d’arriver">${esc(S.note)}</textarea></div>
        <p class="xs muted" style="margin-top:10px">${icon('package', 'sm')} Votre panier contient des articles de ${new Set(lines().map(l => l.p.vendeur)).size} vendeur(s). Les colis sont regroupés : un seul frais de livraison s’applique.</p>
        <div class="row between" style="margin-top:18px"><button class="btn btn-ghost" data-goto="1">${icon('chevron-left', 'sm')} Retour</button><button class="btn btn-primary btn-lg" data-next="3">Continuer vers le paiement</button></div>
      </div>`;
    }

    function stepPaiement() {
      const t = totals();
      const pays = DB.paiements.filter(p => p.actif);
      const p = PAY(S.paiement);
      let extra = '';
      if (p && p.mm) extra = `<div class="field" style="margin-top:14px" id="mm-field"><label>Numéro ${p.nom} à débiter <span class="req">*</span></label><input class="input" id="mmtel" type="tel" inputmode="tel" value="${esc(S.mmTel || (p.prefixes.some(x => user.tel.replace(/\D/g, '').slice(3, 5) === x.slice(1)) ? user.tel : ''))}" placeholder="${p.prefixes[0]} 12 345 67"><span class="err"></span><span class="hint">Préfixes acceptés : ${p.prefixes.join(', ')}. Vous validerez le paiement avec votre code secret sur votre téléphone.</span></div>`;
      if (p && p.id === 'virement') extra = `<div class="alert alert-info" style="margin-top:14px">${icon('bank')}<span>Les coordonnées bancaires et la référence à indiquer vous seront communiquées après validation. La commande est préparée à réception des fonds (1 à 3 jours ouvrés).</span></div>`;
      if (p && p.id === 'cod') extra = `<div class="alert alert-warning" style="margin-top:14px">${icon('cash')}<span>Préparez l’appoint : <b>${fmt(t.total)}</b>. Paiement en espèces ou Mobile Money au livreur. ${t.total > 1000000 ? '<b>Au-delà de 1 000 000 Ar, le paiement à la livraison n’est pas disponible.</b>' : ''}</span></div>`;
      if (p && p.id === 'carte') extra = `<div class="alert alert-info" style="margin-top:14px">${icon('lock')}<span>Vous serez redirigé vers la page sécurisée du prestataire de paiement (3-D Secure). Aucune donnée de carte n’est stockée par Site E_commerce.</span></div>`;
      return `<div class="card card-pad co-section">
        <h3><span class="num">3</span> Moyen de paiement</h3>
        <div class="options-grid two">${pays.map(x => { const blocked = x.id === 'cod' && t.total > 1000000; return `
          <label class="option-card ${S.paiement === x.id ? 'selected' : ''}" style="${blocked ? 'opacity:.5' : ''}"><input type="radio" name="pay" value="${x.id}" ${S.paiement === x.id ? 'checked' : ''} ${blocked ? 'disabled' : ''}>
          <span class="oc-logo" style="background:${x.couleur}">${x.logo}</span><div><b>${x.nom}</b><div class="small muted">${blocked ? 'Indisponible au-delà de 1 000 000 Ar' : x.detail}</div></div></label>`; }).join('')}</div>
        ${extra}
        <div class="field ${S.cgvErr ? 'error' : ''}" style="margin-top:18px"><label class="check" style="font-weight:400;color:var(--text)"><input type="checkbox" id="cgv" ${S.cgv ? 'checked' : ''}> J’ai lu et j’accepte les <a href="infos.html#cgv" target="_blank" style="color:var(--primary);font-weight:600">conditions générales de vente</a> et la <a href="infos.html#confidentialite" target="_blank" style="color:var(--primary);font-weight:600">politique de confidentialité</a>.</label><span class="err">Vous devez accepter les CGV pour commander.</span></div>
        <div class="alert alert-danger hidden" id="pay-err" style="margin-top:12px">${icon('alert')}<span></span></div>
        <div class="row between" style="margin-top:18px"><button class="btn btn-ghost" data-goto="2">${icon('chevron-left', 'sm')} Retour</button><button class="btn btn-primary btn-lg" data-confirm>${icon('lock', 'sm')} Confirmer et payer ${fmt(t.total)}</button></div>
      </div>`;
    }

    function stepConfirmation(o) {
      const p = PAY(o.paiement); const sp = DB.statutsPaiement[o.statutPaiement];
      const nextSteps = {
        paye: 'Votre paiement est confirmé. Les vendeurs préparent vos articles.',
        attente: o.paiement === 'virement' ? 'Effectuez le virement avec la référence ci-dessous. La préparation démarre à réception.' : 'Vous réglerez à la livraison. Les vendeurs préparent vos articles.',
        echoue: 'Le paiement n’a pas abouti. Votre commande est conservée 24 h : vous pouvez réessayer ou changer de moyen de paiement.'
      }[o.statutPaiement];
      return `<div class="card card-pad">
        <div class="success-hero">
          <div class="ok-ico" style="${o.statutPaiement === 'echoue' ? 'background:var(--danger-50);color:var(--danger)' : ''}">${icon(o.statutPaiement === 'echoue' ? 'alert' : 'check')}</div>
          <h1 style="font-size:1.6rem">${o.statutPaiement === 'echoue' ? 'Paiement non abouti' : 'Merci, votre commande est enregistrée !'}</h1>
          <p class="text-2">Numéro de commande</p>
          <div class="order-number">${o.numero}</div>
          <p class="text-2" style="margin-top:16px;max-width:560px;margin-left:auto;margin-right:auto">${nextSteps}</p>
          <div class="row wrap" style="justify-content:center;gap:8px;margin-top:8px">
            <span class="badge badge-${sp.c}"><span class="dot"></span>Paiement : ${sp.l}</span><span class="badge badge-warning"><span class="dot"></span>Livraison : À préparer</span>
          </div>
        </div>
        ${o.paiement === 'virement' ? `<div class="alert alert-info" style="max-width:620px;margin:0 auto 16px">${icon('bank')}<span><b>Banque :</b> BOA Madagascar · <b>IBAN :</b> MG46 0000 5000 0012 3456 7890 123 · <b>Référence obligatoire :</b> ${o.numero}</span></div>` : ''}
        <div class="form-grid two" style="max-width:820px;margin:0 auto">
          <div class="info-list"><b class="small">${icon('pin', 'sm')} Livraison</b><div class="small text-2">${esc(o.adresse.nom)} · ${o.adresse.tel}<br>${esc(o.adresse.adresse)}, ${esc(o.adresse.fokontany)}, ${esc(o.adresse.ville)}<br>${Z(o.zone).nom} — ${Z(o.zone).delai}</div></div>
          <div class="info-list"><b class="small">${icon('card', 'sm')} Paiement</b><div class="small text-2">${p.nom}${o.mmTel ? ' · ' + esc(o.mmTel) : ''}<br>Total : <b>${fmt(o.total)}</b>${o.refPaiement ? '<br>Référence : ' + o.refPaiement : ''}</div></div>
        </div>
        <p class="small muted center" style="margin-top:16px">${icon('bell', 'sm')} Une confirmation vous a été envoyée par e-mail (${esc(user.email)}) et par SMS au ${esc(user.tel)}.</p>
        <div class="row wrap" style="justify-content:center;margin-top:16px">
          ${o.statutPaiement === 'echoue' ? `<button class="btn btn-primary" data-retry>${icon('refresh', 'sm')} Réessayer le paiement</button>` : `<a class="btn btn-primary" href="compte.html#commande=${o.numero}">${icon('package', 'sm')} Suivre ma commande</a>`}
          <a class="btn" href="facture.html?id=${o.numero}">${icon('file', 'sm')} Reçu PDF</a>
          <a class="btn btn-ghost" href="index.html">Retour à l’accueil</a>
        </div>
      </div>`;
    }

    function render(order) {
      document.querySelectorAll('#steps .st').forEach((s, i) => { s.className = 'st ' + (i + 1 < S.step ? 'done' : i + 1 === S.step ? 'on' : ''); });
      const v = document.getElementById('view');
      if (S.step === 4) { v.innerHTML = stepConfirmation(order); return; }
      if (!lines().length) { v.innerHTML = `<div class="empty card">${icon('cart')}<h3>Votre panier est vide</h3><a class="btn btn-primary" href="catalogue.html">Voir le catalogue</a></div>`; return; }
      const body = S.step === 1 ? stepAdresse() : S.step === 2 ? stepLivraison() : stepPaiement();
      v.innerHTML = `<div class="cart-layout"><div>${body}</div>${summary(totals())}</div>`;
    }

    function saveNewAddress() {
      const f = document.getElementById('f-adr');
      const d = Object.fromEntries(new FormData(f).entries());
      S.nouvelle = { ...d, libelle: 'Nouvelle adresse' };
    }

    function goNext(n) {
      if (S.step === 1 && S.adresse === 'new') {
        const f = document.getElementById('f-adr');
        if (!validate(f)) return;
        saveNewAddress();
        if (!zonesPour(S.nouvelle).length) { toast('Aucune zone de livraison ne correspond à cette adresse.', 'error'); return; }
      }
      if (S.step === 2) {
        const a = addr();
        if (!S.zone || !zonesPour(a).find(z => z.id === S.zone)) { toast('Choisissez une zone de livraison compatible avec votre adresse.', 'error'); return; }
        store.set('zone', S.zone);
      }
      S.step = n; render(); scrollTo({ top: 0, behavior: 'smooth' });
    }

    function payErr(msg) { const e = document.getElementById('pay-err'); e.classList.toggle('hidden', !msg); e.querySelector('span').innerHTML = msg || ''; }

    function confirmOrder() {
      const t = totals();
      if (!S.paiement) { payErr('Choisissez un moyen de paiement.'); return; }
      const p = PAY(S.paiement);
      if (p.mm) {
        const tel = document.getElementById('mmtel').value.trim(); const f = document.getElementById('mm-field');
        const digits = tel.replace(/\D/g, '').replace(/^261/, '0');
        let e = '';
        if (!RX.telMg.test(tel)) e = 'Numéro invalide (ex. ' + p.prefixes[0] + ' 12 345 67).';
        else if (!p.prefixes.includes(digits.slice(0, 3))) e = 'Ce numéro n’est pas un numéro ' + p.nom + ' (préfixes : ' + p.prefixes.join(', ') + ').';
        f.classList.toggle('error', !!e); f.querySelector('.err').textContent = e;
        if (e) { document.getElementById('mmtel').focus(); return; }
        S.mmTel = tel;
      }
      if (S.paiement === 'cod' && t.total > 1000000) { payErr('Paiement à la livraison indisponible au-delà de 1 000 000 Ar.'); return; }
      S.cgv = document.getElementById('cgv').checked; S.cgvErr = !S.cgv;
      if (!S.cgv) { document.getElementById('cgv').closest('.field').classList.add('error'); return; }
      // Contrôle final du stock (exigence §8)
      const bad = t.ls.filter(l => l.qte > dispo(l.p));
      if (bad.length) { payErr('Stock insuffisant pour : ' + bad.map(l => esc(l.p.nom)).join(', ') + '. <a href="panier.html" style="font-weight:700">Modifier le panier</a>'); return; }
      payErr('');

      const order = {
        numero: Orders.nextNumber(), date: new Date().toISOString().slice(0, 16).replace('T', ' '), client: 'c1',
        lignes: t.ls.map(l => ({ produit: l.p.id, qte: l.qte, variante: l.variante, prix: l.prix, vendeur: l.p.vendeur })),
        zone: S.zone, paiement: S.paiement, mmTel: S.mmTel, statutPaiement: 'attente', statutLivraison: 'a_preparer', codePromo: t.promo ? t.promo.code : null,
        sousTotal: t.sousTotal, remise: t.remise, frais: t.frais, total: t.total, adresse: addr(), creneau: S.creneau, note: S.note,
        historique: [{ date: 'maintenant', statut: 'Commande créée', par: 'Client' }]
      };
      const finish = statut => {
        order.statutPaiement = statut;
        if (statut === 'paye') { order.refPaiement = 'MP' + Date.now().toString().slice(-10); order.historique.push({ date: 'maintenant', statut: 'Paiement confirmé', par: 'Système' }); }
        if (statut === 'echoue') order.historique.push({ date: 'maintenant', statut: 'Paiement échoué', par: 'Système' });
        Orders.add(order); Cart.clear(); store.set('promo', null);
        S.step = 4; render(order); scrollTo({ top: 0 });
        window._lastOrder = order;
      };
      if (p.mm || p.id === 'carte') {
        order.statutPaiement = 'initie';
        modal({
          title: p.mm ? 'Validez le paiement sur votre téléphone' : 'Paiement par carte — prestataire sécurisé', tone: 'info', icon: p.mm ? 'phone' : 'lock',
          body: `<div class="center"><div class="spinner"></div>
            <p>${p.mm ? `Une demande de paiement de <b>${fmt(t.total)}</b> a été envoyée au <b>${esc(S.mmTel)}</b> (${p.nom}).<br>Composez votre code secret sur votre téléphone pour valider.` : `Redirection vers la page 3-D Secure du prestataire pour <b>${fmt(t.total)}</b>…`}</p>
            <span class="badge badge-info"><span class="dot"></span>Statut : Initié</span>
            <p class="xs muted" style="margin-top:12px">Maquette : choisissez le résultat à simuler.</p></div>`,
          actions: [{ label: 'Simuler un échec', cls: 'btn-danger', onClick: () => finish('echoue') }, { label: 'Simuler : paiement confirmé', cls: 'btn-primary', onClick: () => finish('paye') }]
        });
      } else finish('attente');
    }

    document.addEventListener('click', e => {
      const n = e.target.closest('[data-next]'); if (n) goNext(+n.dataset.next);
      const g = e.target.closest('[data-goto]'); if (g) { e.preventDefault(); if (S.step === 1 && S.adresse === 'new') saveNewAddress(); S.step = +g.dataset.goto; render(); }
      if (e.target.closest('[data-confirm]')) confirmOrder();
      if (e.target.closest('[data-retry]')) {
        const o = window._lastOrder;
        modal({ title: 'Réessayer le paiement', tone: 'info', icon: 'refresh', body: `<p>Commande <b>${o.numero}</b> — ${fmt(o.total)}.</p><p class="small muted">Maquette : la demande est renvoyée au même numéro.</p>`,
          actions: [{ label: 'Annuler' }, { label: 'Simuler : paiement confirmé', cls: 'btn-primary', onClick() {
            o.statutPaiement = 'paye'; o.refPaiement = 'MP' + Date.now().toString().slice(-10);
            const l = store.get('orders', []); const i = l.findIndex(x => x.numero === o.numero); if (i >= 0) { l[i] = o; store.set('orders', l); }
            render(o); toast('Paiement confirmé');
          } }] });
      }
    });
    document.addEventListener('change', e => {
      if (e.target.name === 'adr') { if (S.adresse === 'new') saveNewAddress(); S.adresse = e.target.value; render(); }
      if (e.target.name === 'zone') { S.zone = e.target.value; render(); }
      if (e.target.id === 'creneau') S.creneau = e.target.value;
      if (e.target.id === 'note') S.note = e.target.value;
      if (e.target.name === 'pay') { if (document.getElementById('mmtel')) S.mmTel = document.getElementById('mmtel').value; S.cgv = document.getElementById('cgv').checked; S.paiement = e.target.value; S.mmTel = ''; render(); }
      if (e.target.id === 'cgv') { S.cgv = e.target.checked; S.cgvErr = false; e.target.closest('.field').classList.toggle('error', false); }
    });
    render();
  </script>
</body>
</html>
